<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI ASSISTANT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    :root {
        --bg: #000000;
        --green: #3dfc3d;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: var(--bg);
        color: var(--green);
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 18px 22px;
    }

    /* HEADER ABOVE PANEL */
    #header {
        font-size: 13px;
        letter-spacing: 2px;
        margin-bottom: 12px; /* preserves the blank line */
    }

    /* BORDER BOX */
    #panel {
        border: 1px solid var(--green); /* thin border */
        padding: 10px 12px;
    }

    #panel-text {
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
    }

    /* SPACER pushes buttons + input to bottom */
    #spacer {
        flex: 1;
    }

    /* BUTTONS */
    #suggestions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
        margin-bottom: 14px;
    }

    .sug-btn {
        background: transparent;
        border: 1px solid var(--green);
        color: var(--green);
        padding: 6px 10px;
        font-size: 11px;
        cursor: pointer;
        text-align: left;
    }

    /* INPUT BAR */
    #input-area {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    #msg-input {
        flex: 1;
        background: transparent;
        border: 1px solid var(--green);
        color: var(--green);
        padding: 8px 10px;
        font-size: 13px;
    }

    #msg-input::placeholder {
        color: rgba(61,252,61,0.7);
    }

    #send-btn {
        background: transparent;
        border: 1px solid var(--green);
        color: var(--green);
        padding: 8px 16px;
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
    }

    #send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
</style>
</head>

<body>

<div id="header">AI ASSISTANT // SYSTEM ONLINE //</div>

<div id="panel">
    <div id="panel-text">
Hello. I'm your school AI assistant. I can help with homework, answer general questions, create files, or assist with portal support. What do you need?
    </div>
</div>

<!-- This spacer forces the bottom section to stay at the bottom -->
<div id="spacer"></div>

<div id="suggestions">
    <button class="sug-btn" onclick="useSuggestion(this)">Help me with my homework</button>
    <button class="sug-btn" onclick="useSuggestion(this)">What are good study tips?</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Explain photosynthesis</button>
    <button class="sug-btn" onclick="useSuggestion(this)">How do I reset my password?</button>
    <button class="sug-btn" onclick="useSuggestion(this)">What is the quadratic formula?</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Give me tips for exams</button>
</div>

<div id="input-area">
    <input id="msg-input" type="text" placeholder="TYPE YOUR QUERY..." oninput="updateSend()" onkeydown="handleKey(event)">
    <button id="send-btn" onclick="sendMessage()" disabled>SEND</button>
</div>

<script>
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');

function useSuggestion(btn) {
    inputEl.value = btn.textContent;
    updateSend();
}

function updateSend() {
    sendBtn.disabled = !inputEl.value.trim();
}

function handleKey(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
    }
}

async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    try {
        await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
    } catch (err) {
        // silent fail, same behavior as Base44
    }

    inputEl.value = '';
    updateSend();
}
</script>

</body>
</html>
