<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI ASSISTANT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    :root {
        --green: #3fbf3f;
        --green-soft: #6fdc6f;
        --bg: #000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--bg);
        font-family: Arial, sans-serif;
        color: var(--green);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* HEADER */
    #header {
        padding: 22px 0;
        text-align: center;
        border-bottom: 2px solid var(--green);
        box-shadow: 0 0 12px var(--green);
    }

    #header-title {
        font-size: 26px;
        letter-spacing: 6px;
        font-weight: bold;
        text-shadow: 0 0 8px var(--green);
    }

    #header-sub {
        font-size: 10px;
        letter-spacing: 3px;
        margin-top: 4px;
        color: var(--green-soft);
    }

    /* MAIN AREA */
    #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* MESSAGES */
    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .msg-row { display: flex; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    .msg-bubble {
        max-width: 75%;
        padding: 12px 16px;
        border: 1px solid var(--green);
        background: rgba(63,191,63,0.05);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.6;
        box-shadow: 0 0 6px rgba(63,191,63,0.25);
        white-space: pre-wrap;
    }

    .msg-label {
        font-size: 10px;
        opacity: 0.6;
        margin-bottom: 5px;
        letter-spacing: 2px;
    }

    #thinking { display: none; }

    /* SUGGESTIONS */
    #suggestions {
        padding: 0 24px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .sug-btn {
        background: transparent;
        border: 1px solid var(--green);
        color: var(--green);
        padding: 6px 14px;
        font-size: 11px;
        letter-spacing: 1px;
        cursor: pointer;
        border-radius: 2px;
        text-transform: uppercase;
        transition: 0.15s ease;
        box-shadow: 0 0 6px rgba(63,191,63,0.25);
    }

    .sug-btn:hover {
        background: rgba(63,191,63,0.1);
        box-shadow: 0 0 10px rgba(63,191,63,0.45);
    }

    /* INPUT AREA */
    #input-area {
        border-top: 1px solid var(--green);
        padding: 14px 20px;
        background: #000;
    }

    #input-row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
    }

    #msg-input {
        flex: 1;
        background: rgba(63,191,63,0.05);
        border: 1px solid var(--green);
        border-radius: 3px;
        color: var(--green);
        padding: 10px 12px;
        resize: none;
        font-size: 13px;
    }

    #send-btn {
        background: rgba(63,191,63,0.15);
        border: 1px solid var(--green);
        color: var(--green);
        padding: 10px 20px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    #send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
</style>
</head>

<body>

<div id="header">
    <div id="header-title">AI ASSISTANT</div>
    <div id="header-sub">// SYSTEM ONLINE //</div>
</div>

<div id="main">

    <div id="messages">
        <div class="msg-row assistant">
            <div class="msg-bubble">
                <div class="msg-label">▶ AI_ASSISTANT</div>
Hello. I'm your school AI assistant
